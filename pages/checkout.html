<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finalizar compra — ElevManutenção</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/carrinho.js"></script>
  <script src="../assets/js/pages/checkout.js" defer></script>
</head>
<body style="display:flex;flex-direction:column;min-height:100vh;">

  <header class="cabecalho" id="cabecalho">
    <div class="faixa-sinalizacao"></div>
    <div class="container cabecalho__barra">
      <a href="./home.html" class="marca">
        <span class="marca__indicador"><span></span><span></span><span></span><span></span></span>
        <span>ElevManutenção<br><small>Peças &amp; kits técnicos</small></span>
      </a>
      <nav class="nav-principal">
        <a href="./home.html">Início</a>
        <a href="./loja.html">Catálogo</a>
        <a href="./kits.html">Kits</a>
        <a href="./meus-pedidos.html">Meus pedidos</a>
      </nav>
      <div class="nav-usuario">
        <a href="./carrinho.html" class="icone-carrinho">🛒 <span data-contador-carrinho>0</span></a>
        <span class="nav-usuario__nome">Olá, <strong id="nomeUsuario">cliente</strong></span>
        <button class="botao botao--contorno" id="btnLogout" style="padding:.4rem .8rem;border-color:#fff;color:#fff;">Sair</button>
      </div>
      <div class="icone-menu-hamburguer" id="btnMenuMobile">&#9776;</div>
    </div>
  </header>

  <main class="secao">
    <div class="container">
      <h2 style="margin-bottom:1.4rem;">Finalizar compra</h2>

      <div class="grade-2" style="align-items:start;">
        <div class="painel">
          <h3 style="font-size:1rem;margin-bottom:1rem;">Endereço de entrega</h3>
          <div id="lista-enderecos"><p class="carregando">Carregando endereços...</p></div>

          <details style="margin-top:1.2rem;">
            <summary style="cursor:pointer;font-weight:600;color:var(--azul-700);font-size:.9rem;">+ Cadastrar novo endereço</summary>
            <form id="form-novo-endereco" style="margin-top:1rem;">
              <div class="campo-linha campo-linha--3">
                <div class="campo-grupo"><label>CEP</label><input class="campo-entrada" id="ne-cep" placeholder="00000-000"></div>
                <div class="campo-grupo"><label>Número</label><input class="campo-entrada" id="ne-numero" placeholder="123"></div>
                <div class="campo-grupo"><label>Compl.</label><input class="campo-entrada" id="ne-complemento" placeholder="Opcional"></div>
              </div>
              <div class="campo-grupo"><label>Logradouro</label><input class="campo-entrada" id="ne-logradouro" readonly></div>
              <div class="campo-linha campo-linha--3">
                <div class="campo-grupo"><label>Bairro</label><input class="campo-entrada" id="ne-bairro" readonly></div>
                <div class="campo-grupo"><label>Cidade</label><input class="campo-entrada" id="ne-cidade" readonly></div>
                <div class="campo-grupo"><label>UF</label><input class="campo-entrada" id="ne-estado" readonly></div>
              </div>
              <button type="submit" class="botao botao--contorno botao--bloco">Salvar endereço</button>
            </form>
          </details>
        </div>

        <aside class="painel">
          <h3 style="font-size:1rem;margin-bottom:1rem;">Resumo do pedido</h3>
          <div id="resumo-itens-checkout" style="display:flex;flex-direction:column;gap:.5rem;font-size:.88rem;"></div>
          <div style="display:flex;justify-content:space-between;font-size:1.2rem;font-weight:700;color:var(--azul-900);margin:1rem 0;border-top:1px solid var(--cinza-200);padding-top:1rem;">
            <span>Total</span><span id="checkout-total">R$ 0,00</span>
          </div>
          <button class="botao botao--laranja botao--bloco" id="btnConfirmarPedido">Confirmar pedido</button>
          <div id="res-checkout" class="mensagem-resposta"></div>
        </aside>
      </div>
    </div>
  </main>

  <footer class="rodape">
    <div class="container"><div class="rodape__baixo">© 2026 ElevManutenção — Projeto acadêmico de e-commerce B2B.</div></div>
  </footer>

</body>
</html>
