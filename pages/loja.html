<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo — ElevManutenção</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/loja.css">
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/carrinho.js"></script>
  <script src="../assets/js/pages/loja.js" defer></script>
</head>
<body style="display:flex;flex-direction:column;min-height:100vh;">

  <header class="cabecalho" id="cabecalho">
    <div class="faixa-sinalizacao"></div>
    <div class="container cabecalho__barra">
      <a href="./home.html" class="marca">
        <span class="marca__indicador"><span></span><span></span><span></span><span></span></span>
        <span>ElevManutenção<br><small>Peças &amp; kits técnicos</small></span>
      </a>
      <nav class="nav-principal">
        <a href="./home.html">Início</a>
        <a href="./loja.html" class="ativo">Catálogo</a>
        <a href="./kits.html">Kits</a>
        <a href="./meus-pedidos.html">Meus pedidos</a>
      </nav>
      <div class="nav-usuario">
        <a href="./carrinho.html" class="icone-carrinho">🛒 <span data-contador-carrinho>0</span></a>
        <span class="nav-usuario__nome">Olá, <strong id="nomeUsuario">cliente</strong></span>
        <button class="botao botao--contorno" id="btnLogout" style="padding:.4rem .8rem;border-color:#fff;color:#fff;">Sair</button>
      </div>
      <div class="icone-menu-hamburguer" id="btnMenuMobile">&#9776;</div>
    </div>
  </header>

  <main>
    <section class="secao" style="padding-bottom:0;">
      <div class="container">
        <span class="eyebrow">Catálogo completo</span>
        <h2 style="margin-bottom:1.2rem;">Produtos para manutenção de elevadores</h2>
      </div>
    </section>

    <section class="secao">
      <div class="container loja__layout">
        <aside class="loja__filtros painel">
          <h3 style="font-size:1rem;margin-bottom:1rem;">Filtrar</h3>

          <div class="campo-grupo">
            <label for="f-busca">Nome ou código</label>
            <input class="campo-entrada" id="f-busca" placeholder="Ex: rolamento, EM-C25...">
          </div>

          <div class="campo-grupo">
            <label for="f-categoria">Categoria</label>
            <select class="campo-entrada" id="f-categoria">
              <option value="">Todas</option>
            </select>
          </div>

          <div class="campo-grupo">
            <label>Faixa de preço (R$)</label>
            <div class="campo-linha campo-linha--2">
              <input class="campo-entrada" type="number" min="0" id="f-preco-min" placeholder="Mín.">
              <input class="campo-entrada" type="number" min="0" id="f-preco-max" placeholder="Máx.">
            </div>
          </div>

          <div class="campo-grupo" style="display:flex;align-items:center;gap:.5rem;">
            <input type="checkbox" id="f-disponivel" style="width:auto;">
            <label for="f-disponivel" style="margin:0;">Somente com estoque disponível</label>
          </div>

          <div class="campo-grupo">
            <label for="f-ordenar">Ordenar por</label>
            <select class="campo-entrada" id="f-ordenar">
              <option value="">Relevância</option>
              <option value="preco_asc">Menor preço</option>
              <option value="preco_desc">Maior preço</option>
            </select>
          </div>

          <button class="botao botao--laranja botao--bloco" id="btnFiltrar">Aplicar filtros</button>
          <button class="botao botao--contorno botao--bloco" id="btnLimparFiltros" style="margin-top:.6rem;">Limpar</button>
        </aside>

        <div>
          <p id="contagem-resultados" style="color:var(--cinza-600);font-size:.85rem;margin-bottom:1rem;"></p>
          <div class="grade-produtos" id="grade-produtos">
            <p class="carregando">Carregando produtos...</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="rodape">
    <div class="container">
      <div class="rodape__baixo">© 2026 ElevManutenção — Projeto acadêmico de e-commerce B2B.</div>
    </div>
  </footer>

</body>
</html>
