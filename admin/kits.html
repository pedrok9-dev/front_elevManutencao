<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kits — Painel ElevManutenção</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="./js/kits.js" defer></script>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="marca"><span class="marca__indicador"><span></span><span></span><span></span><span></span></span>ElevManutenção<br><small>Painel administrativo</small></div>
      <nav class="admin-nav">
        <a href="./dashboard.html">📊 Dashboard</a>
        <div class="admin-nav__rotulo">Catálogo</div>
        <a href="./produtos.html">📦 Produtos</a>
        <a href="./categorias.html">🏷️ Categorias</a>
        <a href="./fornecedores.html">🚚 Fornecedores</a>
        <a href="./kits.html" class="ativo">🧰 Kits</a>
        <div class="admin-nav__rotulo">Operação</div>
        <a href="./estoque.html">📈 Estoque</a>
        <a href="./pedidos.html">🧾 Pedidos</a>
        <a href="./entregas.html">🚛 Entregas</a>
        <div class="admin-nav__rotulo">Análise</div>
        <a href="./relatorios.html">📊 Relatórios</a>
      </nav>
      <div class="admin-sidebar__rodape">
        <div class="admin-sidebar__usuario">Logado como<br><strong id="nomeUsuario">admin</strong></div>
        <button class="botao botao--contorno botao--bloco" id="btnLogout" style="border-color:#fff;color:#fff;">Sair</button>
        <a href="../pages/home.html" class="botao botao--laranja botao--bloco">Ver loja</a>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-topo">
        <div><h1>Kits de manutenção</h1><p>Conjuntos de produtos vendidos como solução pronta.</p></div>
        <button class="botao botao--laranja" id="btnNovoKit">+ Novo kit</button>
      </div>

      <div class="grade-produtos" id="grade-kits-admin">
        <p class="carregando">Carregando kits...</p>
      </div>
    </main>
  </div>

  <div class="modal-fundo" id="modal-kit">
    <div class="modal-caixa">
      <div class="modal-caixa__topo">
        <h3 id="modal-kit-titulo">Novo kit</h3>
        <button class="modal-caixa__fechar" id="btnFecharModalKit">&times;</button>
      </div>
      <form id="form-kit">
        <input type="hidden" id="k-id">
        <div class="campo-grupo"><label>Nome do kit</label><input class="campo-entrada" id="k-nome" required></div>
        <div class="campo-grupo"><label>Descrição</label><textarea class="campo-entrada" id="k-descricao" rows="2"></textarea></div>
        <div class="campo-linha campo-linha--2">
          <div class="campo-grupo"><label>Categoria</label><select class="campo-entrada" id="k-categoria"></select></div>
          <div class="campo-grupo"><label>Preço do kit (R$)</label><input class="campo-entrada" type="number" step="0.01" min="0.01" id="k-preco" required></div>
        </div>

        <label style="display:block;font-size:.82rem;font-weight:600;color:var(--azul-900);margin-bottom:.4rem;">Composição do kit</label>
        <div id="itens-kit"></div>
        <button type="button" class="botao botao--contorno" id="btnAddItemKit" style="margin-top:.4rem;">+ Adicionar produto</button>

        <button type="submit" class="botao botao--laranja botao--bloco" style="margin-top:1.2rem;">Salvar kit</button>
      </form>
      <div id="res-kit" class="mensagem-resposta"></div>
    </div>
  </div>

</body>
</html>
